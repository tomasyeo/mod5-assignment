<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Expert Multi-Agent</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #f5f5f7;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
        }

        header {
            background-color: #2c2c2e;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #3a3a3c;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            color: #ffffff;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 18px;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: #0a84ff;
            color: white;
        }

        .agent-message {
            align-self: flex-start;
            background-color: #3a3a3c;
            color: #ffffff;
        }

        #feedback-area {
            background-color: #000000;
            color: #30d158;
            padding: 10px 20px;
            font-family: 'SF Mono', SFMono-Regular, ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace;
            font-size: 12px;
            height: 120px;
            overflow-y: auto;
            border-top: 1px solid #3a3a3c;
        }

        #input-area {
            font-size: 18px;
            background-color: #2c2c2e;
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #3a3a3c;
        }

        input {
            flex: 1;
            padding: 12px;
            background-color: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input::placeholder {
            color: #8e8e93;
        }

        button {
            padding: 10px 20px;
            background-color: #0a84ff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background-color: #409cff;
        }
    </style>
</head>

<body>
    <header>
        <h1>Apple Expert Goon Squad</h1>
    </header>

    <div id="chat-container">
        <div class="message agent-message">Hello! I'm your Apple Expert Goon Squad. How may I gaslight you today?</div>
    </div>

    <div id="feedback-area">
        <div>[System] Ready.</div>
    </div>

    <form id="input-area">
        <input type="text" id="user-input" placeholder="Ask about Apple products, policies, or tech support..."
            autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const feedbackArea = document.getElementById('feedback-area');
        const inputForm = document.getElementById('input-area');
        const userInput = document.getElementById('user-input');

        let chatHistory = [];

        function addMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-message' : 'agent-message'}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Add to local history state
            chatHistory.push({ role: isUser ? "user" : "assistant", content: text });
        }

        function addFeedback(text) {
            const logDiv = document.createElement('div');
            logDiv.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            feedbackArea.appendChild(logDiv);
            feedbackArea.scrollTop = feedbackArea.scrollHeight;
        }

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            userInput.value = '';
            addFeedback(`Sending query to gateway...`);

            try {
                // Ensure we use the correct absolute path for the current origin
                const endpoint = `${window.location.origin}/chat`;
                addFeedback(`Fetching from: ${endpoint}`);

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        history: chatHistory.slice(0, -1)
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Server responded with ${response.status}`);
                }

                const data = await response.json();

                if (data.feedback) {
                    data.feedback.forEach(f => addFeedback(f));
                }

                addMessage(data.response, false);
            } catch (err) {
                console.error("Chat Error:", err);
                addFeedback(`Error: ${err.message}`);
                addMessage(`Sorry, I encountered an error: ${err.message}`, false);
            }
        });
    </script>
</body>

</html>
